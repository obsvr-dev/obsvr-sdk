[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "obsvr-sdk"
dynamic = ["version"]  # single source: obsvr/_version.py
description = "obsvr LLM audit SDK for Python — fire-and-forget signed audit events with built-in PII policy, deterministic rule enforcement, and framework auto-instrumentation"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "obsvr" }]
keywords = [
    "llm", "audit", "governance", "compliance", "observability",
    "pii", "ai-governance", "openai", "anthropic", "langchain",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Monitoring",
    "Typing :: Typed",
]
dependencies = []

# Offline evidence verification without a Node toolchain. Same modes, exit
# codes, and verdicts as the npm `obsvr-verify` CLI.
[project.scripts]
obsvr-verify = "obsvr.cli_verify:main"

[project.urls]
Homepage = "https://github.com/obsvr-dev/obsvr-sdk"
Repository = "https://github.com/obsvr-dev/obsvr-sdk"
Issues = "https://github.com/obsvr-dev/obsvr-sdk/issues"

[project.optional-dependencies]
# Direct provider clients. obsvr.register patches openai/anthropic client
# classes and obsvr.auto wires the OpenAI Agents tracing processor, so these
# are imported by the package even though no framework integration names them.
# Each floor is the earliest release carrying the symbol the code reads:
# openai 1.0.0 introduced AsyncOpenAI, anthropic 0.3.0 introduced
# AsyncAnthropic, openai-agents 0.0.2 introduced add_trace_processor.
openai = ["openai>=1.0.0"]
anthropic = ["anthropic>=0.3.0"]
openai-agents = ["openai-agents>=0.0.2"]
# Bounded below 2.0 on evidence, not caution. mcp 2.0.0 moved the protocol
# types to a snake_case base model (alias_generator=to_camel), so the three
# descriptor fields obsvr/integrations/mcp.py reads through getattr are renamed
# and the camelCase spellings survive only as serialization aliases:
# Tool.inputSchema -> input_schema, PaginatedResult.nextCursor -> next_cursor,
# ToolAnnotations.destructiveHint -> destructive_hint. On 2.x every one of them
# would read as absent rather than raise, which silently switches off the
# schema-surface poisoning scan, drops inputSchema out of the descriptor pin
# hash (a rug-pull that edits only the schema would then hash identically), and
# empties the destructive-capability gate. Upstream advises the same bound for
# callers that have not migrated.
mcp = ["mcp>=1.0.0,<2.0.0"]
langchain = ["langchain-core>=0.2.0"]
# NOTE: this floor rests on WEAKER evidence than the others in this file, and
# the difference is deliberate. The other floors name the first release that
# demonstrably works; this one names the lowest release VERIFIED working live
# (0.11.23: provider attributed, tokens captured, one event per call). Versions
# below it are excluded because they could not be MEASURED, not because they
# were proven broken — the 0.10.x line pulls an early-2024 dependency set whose
# first import downloads an NLTK corpus into a fresh environment and then hangs
# against a current openai/httpx, so no probe of it completes. What is known:
# the declared 0.10.0 emits no audit event at all, and the TypeScript twin at
# the same era (llamaindex 0.5.0/0.5.8) has the identical defect. A conservative
# floor that states its own basis beats an unverifiable claim left standing.
llamaindex = ["llama-index-core>=0.11.23"]
# No crewai release permits 3.14 — every one of them caps at <3.14 or <=3.13 —
# while this package requires only >=3.10. Without the marker a 3.14 user
# backtracks the whole release history before failing on a resolution error
# that never names the interpreter. The marker makes the extra resolve to
# nothing there instead, which is the same practical outcome (crewai is
# uninstallable on 3.14) reached cleanly and stated in the manifest.
crewai = ["crewai>=0.30.0; python_version < '3.14'"]
autogen = ["pyautogen>=0.2.0"]
fastapi = ["starlette>=0.30.0"]
otel = ["opentelemetry-api>=1.20.0"]
bedrock = ["boto3>=1.34.0"]
vertex = ["google-cloud-aiplatform>=1.38.0"]
# pydantic_ai.toolsets.WrapperToolset — the symbol pydantic_ai.py binds — does
# not exist until 0.4.4. Below it nothing raises: ObsvrToolset falls back to a
# local shim and govern_toolset() still returns an object, but it is not a
# toolset PydanticAI accepts, so denied-tool policy, per-tool auditing and step
# limits are all silently inert while the manifest advertises support.
pydantic-ai = ["pydantic-ai-slim>=0.4.4"]
haystack = ["haystack-ai>=2.0.0"]
# Ed25519 verification of signed remote policy. Optional because the package
# ships zero mandatory runtime dependencies and Python has no stdlib Ed25519;
# without it a pinned policy key still fails closed, and events carry
# policy_verification_unavailable. PyNaCl is accepted as an alternative.
crypto = ["cryptography>=41.0.0"]
# The PyNaCl half of that alternative, as its own extra rather than a second
# entry in `crypto`. policy_verify resolves ONE backend — cryptography first,
# then PyNaCl — so listing both under `crypto` would install a second Ed25519
# implementation that never gets called. Install `crypto` or `crypto-nacl`,
# not both. 1.0 is the earliest release carrying nacl.signing.VerifyKey and
# nacl.exceptions.BadSignatureError.
crypto-nacl = ["PyNaCl>=1.0.0"]
dev = ["pytest>=7.0", "cryptography>=41.0.0", "hypothesis>=6.0"]

[tool.setuptools.dynamic]
version = { attr = "obsvr._version.__version__" }

[tool.setuptools.packages.find]
include = ["obsvr*"]

[tool.setuptools.package-data]
obsvr = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# Minimal, correctness-only lint: ruff's default E (pycodestyle errors)
# and F (pyflakes) rule set. Deliberately not a style linter.
[tool.ruff]
extend-exclude = ["build", "dist"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# Deliberate mid-file imports (documented in-source: cycle avoidance and
# single-sourcing of the wire version); not import-order accidents.
"obsvr/policy.py" = ["E402", "F841"]
"obsvr/remote.py" = ["E402"]
"obsvr/rules.py" = ["E402"]
# Tests import symbols for fixtures/monkeypatching and keep illustrative
# locals; correctness gating there adds noise, not safety.
"tests/*" = ["E402", "E731", "F401", "F841"]
