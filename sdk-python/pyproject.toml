[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "obsvr-sdk"
dynamic = ["version"]  # single source: obsvr/_version.py
description = "obsvr LLM audit SDK for Python — fire-and-forget signed audit events with built-in PII policy, deterministic rule enforcement, and framework auto-instrumentation"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "obsvr" }]
keywords = [
    "llm", "audit", "governance", "compliance", "observability",
    "pii", "ai-governance", "openai", "anthropic", "langchain",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Monitoring",
    "Typing :: Typed",
]
dependencies = []

# Offline evidence verification without a Node toolchain. Same modes, exit
# codes, and verdicts as the npm `obsvr-verify` CLI.
[project.scripts]
obsvr-verify = "obsvr.cli_verify:main"

[project.urls]
Homepage = "https://github.com/obsvr-dev/obsvr-sdk"
Repository = "https://github.com/obsvr-dev/obsvr-sdk"
Issues = "https://github.com/obsvr-dev/obsvr-sdk/issues"

[project.optional-dependencies]
# Direct provider clients. obsvr.register patches openai/anthropic client
# classes and obsvr.auto wires the OpenAI Agents tracing processor, so these
# are imported by the package even though no framework integration names them.
#
# The two provider floors below are the earliest release carrying an entry in
# AUDITABLE_METHODS, NOT the earliest release that imports. A client the
# package can construct but has no auditable path on is governed by nothing and
# stays silent while that happens, which is exactly what the previous floors
# advertised. Both were re-established by an exhaustive walk — one throwaway
# environment per published release, no bisect — so every boundary named here
# is an adjacent tested pair, and the boundaries were then re-run live and
# graded on the captured event.
#
# 1.0.0 carries exactly ONE of the seven declared paths,
# chat.completions.create; beta.chat.completions.parse joins it at 1.40.0.
# responses.create and responses.parse both arrive at 1.66.0, and this floor is
# a LOCATED EDGE rather than the lowest release anyone happened to try: the
# adjacent pair was run live, and at 1.65.5 both paths read ABSENT ('OpenAI'
# object has no attribute 'responses') while at 1.66.0 both are AUDITED on a
# real call.
#
# The range deliberately does not promise the rest, and the honest reading is
# per path rather than per range: chat.completions.parse and
# beta.chat.completions.create arrive at 1.92.0, and beta.responses.create only
# at 2.45.0 — six releases out of 326. The floor is NOT raised to cover that
# last one, because a range standing for six releases would misdescribe the 141
# on which the responses paths do work. One hole is upstream and left
# unexcluded: 1.99.0 ships a broken openai.types.responses, so both responses
# paths read absent there and are present again in 1.99.1 the next day.
openai = ["openai>=1.66.0"]
# 0.3.0 governed NOTHING, which is worse than thin. The 0.3.x client exposes
# only completions.create — the superseded text-completion path, absent from
# AUDITABLE_METHODS — so an operator who resolved the declared floor built a
# client, wired obsvr, sent traffic and got zero audit events with nothing
# raising. Confirmed live rather than read off a shape: 0.7.8 grades NO_AUDIT
# because no auditable path exists on the client at all.
#
# messages.create, the path the support table is actually about, arrives at
# 0.16.0, and this floor is a LOCATED EDGE: the adjacent pair was run live, and
# at 0.15.1 the client carries no messages attribute at all, so messages.create
# reads ABSENT and obsvr does not even recognise the client — detectedProvider
# records "unknown". At 0.16.0 it is detected as anthropic and messages.create
# is AUDITED on a real call. The only auditable path below this floor is
# beta.messages.create, reaching back to 0.8.0.
#
# messages.parse arrives at 0.77.0 and is not promised by this range. Raise to
# 0.36.0 if the beta namespace must be covered too — that same 0.16.0 cell
# shows beta gone ('Anthropic' object has no attribute 'beta'), which is
# upstream history (the namespace was removed when that API graduated, and
# beta.messages returned at 0.36.0), not an obsvr regression.
anthropic = ["anthropic>=0.16.0"]
# The floor is where the framework RUNS under the current openai client, not
# where obsvr's symbols first appear. add_trace_processor reaches back to
# 0.0.2 and the tool-guardrail surface attach_tool_gate binds arrives at
# 0.4.0 (types and executor consult in the same release) — but every release
# 0.4.0-0.18.0 fails to construct its own Usage container under openai
# 2.52.0 (InputTokensDetails now requires cache_write_tokens, and those
# releases build it by hand), so Runner.run dies before any tool is reached.
# Measured 2026-08-02: 0.19.0 is the oldest release that completes a live
# run, and the tool gate is live-proven at 0.19.0 and 0.19.2 (denied tool at
# zero side-effect writes, both mechanisms, paired allow controls). The old
# >=0.0.2 floor was a claim about releases the gate had never run on; a
# version it never worked on was never supported, only claimed. Capability
# is still probed by attribute presence, never by version comparison.
openai-agents = ["openai-agents>=0.19.0,<1.0.0"]
# generate_content has been in AUDITABLE_METHODS and duck-typed by
# _detect_provider all along, and the README teaches the wrap, but no extra
# named the distribution — so `pip install "obsvr-sdk[gemini]"` failed on a
# surface that works. This declares what already exists.
#
# DELIBERATELY UNBOUNDED, and that is the honest state rather than a cautious
# one. There is exactly ONE live cell behind this row (0.8.6: a real call, a
# captured event), and a single cell locates no edge — it shows that version
# works and would not find a break above or below it. Every floor in this file
# that was guessed rather than measured turned out to be wrong, so no number is
# invented here; when a walk locates the boundary, this gets one.
#
# Two further limits, stated rather than left to be discovered. This client is
# NOT picked up by obsvr.init() the way the two above are — construct
# interception does not cover it, so it needs an explicit
# obsvr.wrap(genai.GenerativeModel(...)), measured as zero events on the auto
# path. And this is the LEGACY distribution — obsvr governs it because
# applications still run it. The maintained successor is a separate
# distribution with a different response shape, and it is NOT intercepted; the
# READMEs carry both states.
gemini = ["google-generativeai"]
# The current major, bounded below the next. mcp 2.0.0 moved the protocol types
# to a snake_case base model (alias_generator=to_camel), renaming the three
# descriptor fields the integration reads — Tool.inputSchema -> input_schema,
# PaginatedResult.nextCursor -> next_cursor, ToolAnnotations.destructiveHint ->
# destructive_hint — leaving the camelCase spellings as serialization aliases
# only. A single-spelling read finds them absent rather than raising, so obsvr
# reads both (obsvr/mcp_fields.py) and the rename stopped being a reason to
# exclude the major. Driven end to end at 2.0.0 over real JSON-RPC: a denied
# tool at zero executions on every client route, and a descriptor poisoned only
# in its schema still flagged and stripped from the listing.
#
# The floor is 2.0.0 because that is where the range is MEASURED, not because
# 1.x is known broken — the same legs are green at 1.29.0 and the harness keeps
# them. A range nobody has driven is a claim rather than a promise, and this one
# now ends where the evidence does.
mcp = ["mcp>=2.0.0,<3.0.0"]
langchain = ["langchain-core>=0.2.0"]
# The current major, bounded below the next, with the floor at the oldest
# release the tool gate can actually be driven on. The previous range,
# >=0.11.23 uncapped, spanned the 0.13.0 cliff where the framework stopped
# dispatching tool events altogether, so it claimed releases on both sides of a
# behaviour change nobody had measured.
#
# The floor is 0.14.5 rather than 0.14.0, and that is a measurement. The gate's
# seam is present at 0.14.0 — get_tools/_call_tool on both agent bases, and
# call/acall plus the private _fn/_async_fn/_real_fn on FunctionTool — but core
# 0.14.0 cannot complete a tool-calling run with any current provider adapter:
# llama-index-llms-openai from 0.6.5 up requires core>=0.14.5, and 0.6.0, the
# newest pip will place beside core 0.14.0, imports ThinkingBlock, which core
# does not define until 0.14.4. A core with no LLM adapter cannot run an agent,
# so 0.14.5 is the oldest release the gate can be DRIVEN on. 0.14.5 and 0.14.23
# are both driven live, denied tool at zero executions on each.
#
# Nothing in the integration reads a version string, and this framework is why:
# llama-index-core 0.14.0 ships llama_index.core.__version__ == "0.13.6".
# Capability is probed by attribute presence.
llamaindex = ["llama-index-core>=0.14.5,<0.15.0"]
# No crewai release permits 3.14 — every one of them caps at <3.14 or <=3.13 —
# while this package requires only >=3.10. Without the marker a 3.14 user
# backtracks the whole release history before failing on a resolution error
# that never names the interpreter. The marker makes the extra resolve to
# nothing there instead, which is the same practical outcome (crewai is
# uninstallable on 3.14) reached cleanly and stated in the manifest.
#
# The previous range, >=0.30.0 with no cap, was an assertion, not a
# measurement: nothing below 1.0.0 was ever driven, so nothing below 1.0.0
# was ever supported — it was only claimed. The range now stands on a version
# matrix (one venv per version, capability probed by attribute presence, the
# governor driven through each version's own to_structured_tool/invoke and
# tool.run dispatch): the tool governor gates on every version probed —
# 1.0.0, 1.8.0, 1.12.0, 1.14.0, 1.14.7, 1.15.0 through 1.15.4, 1.15.7,
# 1.15.10 — and 1.0.0 and 1.15.10 were additionally driven LIVE, a denied
# tool's side effect at zero writes on both, the allow control at exactly
# one.
#
# The pre-execution hook gate is a 1.15.3+ capability, and the edge is an
# adjacent tested pair with a trap inside it: 1.8.0 through 1.15.2 ship the
# register/unregister half of the hook system with NO dispatcher and no
# executor call site, so a hook accepted there is never consulted.
# install_tool_gate_hook() feature-detects the dispatch side (never the
# version string) and refuses loudly with a pointer at govern_tool on any
# build where hooks would be accepted but never asked.
#
# The cap excludes the next major on purpose: 1.x → 2.x is where this
# framework has historically moved its dispatch internals, and a range that
# silently claims an unreleased major is the same untested promise the old
# floor was.
crewai = ["crewai>=1.0.0,<2.0.0; python_version < '3.14'"]
# autogen.py codes to ConversableAgent.register_hook — the AutoGen 0.2.x API,
# whose maintained continuation is the ag2 distribution. The previously declared
# distribution is no longer that project: its 0.10.0 is a proxy for the 0.4+
# rewrite, whose AssistantAgent has neither register_hook nor initiate_chat, so
# register_obsvr() raises and nothing is governed. The old floor was worse than
# wrong — 0.2.0 has no register_hook at all.
#
# THE CEILING IS LOAD-BEARING, not caution: ag2 1.0.0 removed ConversableAgent
# outright and renamed the import package from `autogen` to `ag2`, so the two
# symbols this integration binds are both gone above it.
#
# Floor is the first ag2 release, verified live. Every stable 0.x release
# between the endpoints was tested for binding — 57 of 58 bind, and the 58th is
# yanked on the index so no resolver selects it.
#
# This changes what the extra INSTALLS, not what the integration BINDS: binding
# is duck-typed on ConversableAgent.register_hook, so an existing install of the
# old distribution in its working range keeps being governed.
autogen = ["ag2>=0.3.2,<1.0"]
fastapi = ["starlette>=0.30.0"]
otel = ["opentelemetry-api>=1.20.0"]
bedrock = ["boto3>=1.34.0"]
vertex = ["google-cloud-aiplatform>=1.38.0"]
# The current major, bounded below the next. The previous specifier had a floor
# of 0.4.4 — the release that first ships pydantic_ai.toolsets.WrapperToolset,
# below which ObsvrToolset falls back to a local shim that PydanticAI does not
# accept as a toolset — and NO ceiling, so it claimed two majors nothing had
# ever run against. Raising the floor withdraws no working version: it ends a
# claim that was never measured.
#
# Both ends of this range are driven: 2.0.0 and 2.22.0, paired allow/deny per
# tool-registration style, with the latest additionally driven against a real
# provider whose model chose to call the denied tool. A denied tool executes
# zero times on both.
pydantic-ai = ["pydantic-ai-slim>=2.0.0,<3.0.0"]
haystack = ["haystack-ai>=2.0.0"]
# Ed25519 verification of signed remote policy. Optional because the package
# ships zero mandatory runtime dependencies and Python has no stdlib Ed25519;
# without it a pinned policy key still fails closed, and events carry
# policy_verification_unavailable. PyNaCl is accepted as an alternative.
crypto = ["cryptography>=41.0.0"]
# The PyNaCl half of that alternative, as its own extra rather than a second
# entry in `crypto`. policy_verify resolves ONE backend — cryptography first,
# then PyNaCl — so listing both under `crypto` would install a second Ed25519
# implementation that never gets called. Install `crypto` or `crypto-nacl`,
# not both. 1.0 is the earliest release carrying nacl.signing.VerifyKey and
# nacl.exceptions.BadSignatureError.
crypto-nacl = ["PyNaCl>=1.0.0"]
# `mcp` is the one upstream framework package the test suite installs for real.
# Every other integration is tested against hand-written fakes, which is stated
# in tests/README.md rather than left to be discovered. This one is different
# because SECURITY.md names the MCP tool gate as the surface to put a
# destructive capability behind, and a gate nothing has driven against the real
# package is graded by its own restatement. Same specifier as the `mcp` extra
# above, so the version this is tested against is the version callers install.
# It stays out of the blocking dependency audit by construction: that job runs
# `pip-audit --strict .` over declared RUNTIME dependencies, which remain empty,
# and the environment audit that would see these is report-only.
dev = ["pytest>=7.0", "cryptography>=41.0.0", "hypothesis>=6.0", "mcp>=2.0.0,<3.0.0"]

[tool.setuptools.dynamic]
version = { attr = "obsvr._version.__version__" }

[tool.setuptools.packages.find]
include = ["obsvr*"]

[tool.setuptools.package-data]
obsvr = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# Minimal, correctness-only lint: ruff's default E (pycodestyle errors)
# and F (pyflakes) rule set. Deliberately not a style linter.
[tool.ruff]
extend-exclude = ["build", "dist"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# Deliberate mid-file imports (documented in-source: cycle avoidance and
# single-sourcing of the wire version); not import-order accidents.
"obsvr/policy.py" = ["E402", "F841"]
"obsvr/remote.py" = ["E402"]
"obsvr/rules.py" = ["E402"]
# Tests import symbols for fixtures/monkeypatching and keep illustrative
# locals; correctness gating there adds noise, not safety.
"tests/*" = ["E402", "E731", "F401", "F841"]
