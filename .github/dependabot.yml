version: 2

# Dependency updates for every ecosystem this repo actually consumes: the
# TypeScript SDK's npm tree, the Python SDK's pyproject, and the pinned actions
# in .github/workflows.
#
# This file schedules VERSION updates. The security updates that matter most —
# a PR per open advisory — additionally require "Dependabot alerts" and
# "Dependabot security updates" to be enabled in the repository's Settings ->
# Advanced Security. Neither can be turned on from a file in the repo, so a
# green checkout of this file is not by itself evidence that advisories are
# being raised; check the settings.
#
# Grouping is deliberate. The npm dev tree is ~540 packages of test and lint
# tooling, and ungrouped weekly updates would open enough PRs that they stop
# being read — which is the same failure as not scanning at all. Minor and
# patch bumps therefore land as one PR per ecosystem per week; majors stay
# separate because they need a human to look at the changelog. Dependabot
# raises security PRs outside these groups, so an advisory never waits behind
# a routine bump.
updates:
  - package-ecosystem: npm
    directory: /sdk
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      npm-minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]
    # Majors are not proposed for the language toolchain. First activation
    # filed eight of them at once (typescript 5 to 7, eslint 9 to 10,
    # @types/node 20 to 26, jest), every one red in CI, which is the noise
    # this file's grouping exists to avoid. These are dev-only: the published
    # tree declares no runtime dependencies, so a stale one here cannot reach
    # a consumer. Upgrade them deliberately, on their own branch, reading the
    # changelog. Security updates ignore this list, so an advisory still
    # arrives as its own PR.
    ignore:
      - dependency-name: "*"
        update-types: [version-update:semver-major]

  - package-ecosystem: pip
    directory: /sdk-python
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      pip-minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      - dependency-name: "*"
        update-types: [version-update:semver-major]

  # Covers .github/workflows. Actions are the one ecosystem here that runs with
  # repository credentials, so a stale pinned action is a supply-chain risk to
  # the release path itself, not just to a build.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      actions-minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]
