name: Scorecard

# OpenSSF Scorecard: an independent, automated grade of this repository's
# supply-chain posture. It checks things this repo already does (pinned
# dependencies, least-privilege tokens, CodeQL, signed releases, branch
# protection) and reports what it finds, without taking our word for any of it.
#
# Widely adopted across mature open-source infrastructure projects. For a
# project selling independent verification of AI decisions, having its own
# supply chain graded by a third party is the same argument applied to itself.
#
# Results land in the Security tab as SARIF. The badge is worth adding to the
# README once the first run has a score to show.

on:
  schedule:
    # Weekly. Scorecard grades repository CONFIGURATION, which changes rarely;
    # a daily run would report the same number and stop being read.
    - cron: "37 6 * * 1"
  push:
    branches: [main]
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    name: Analyze supply-chain posture
    runs-on: ubuntu-latest
    permissions:
      # Write the SARIF into the Security tab.
      security-events: write
      # Read the OIDC token Scorecard uses to publish to the public
      # OpenSSF dataset; this is what lets anyone verify the score
      # independently rather than trusting a badge we render ourselves.
      id-token: write
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          # Publish to the OpenSSF public dataset so the score is checkable by
          # someone who does not trust this repository's own reporting - which
          # is the entire point of running it.
          publish_results: true

      - name: Keep the raw result
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scorecard-sarif
          path: results.sarif
          retention-days: 30

      - name: Upload to the Security tab
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          sarif_file: results.sarif
