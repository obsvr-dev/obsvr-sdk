name: Nightly

# Hunts for the failures that only appear on a seed nobody has drawn yet.
#
# This job exists because of a specific incident. The canonical-JSON property
# suite runs 500 cases per property on a PR, which passed for weeks; CI then
# drew a fresh seed on an unrelated changelog push, found a `__proto__`
# counterexample, and went red across five open Dependabot PRs at once. The
# bug was real and worth finding. Finding it that way was not: it surfaced on
# a change that could not have caused it, and the noise was read as the
# dependency bumps being broken.
#
# So the deep search runs here instead - off the critical path, at counts a PR
# cannot afford, with a seed that changes every night. A failure here is a
# genuine counterexample, not a flake, and the run that finds it is doing its
# job.

on:
  schedule:
    # Daily, clear of the working day so a red nightly is read in the morning
    # rather than mid-task. Deliberately NOT on the hour: GitHub delays or
    # drops scheduled runs under load, and every repo that schedules on the
    # hour piles into the same minute. Projects that run a lot of scheduled
    # work all pick an off-hour minute for this reason.
    - cron: "23 3 * * *"
  workflow_dispatch:
    inputs:
      num_runs:
        description: "fast-check cases per property"
        required: false
        default: "50000"
        type: string
      cases:
        description: "cross-language parity documents"
        required: false
        default: "40000"
        type: string

permissions:
  contents: read

concurrency:
  # A manual run should replace a scheduled one rather than queue behind it.
  group: nightly
  cancel-in-progress: true

jobs:
  properties:
    name: Property search (deep)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: sdk-typescript/package-lock.json
      - run: npm ci
        working-directory: sdk-typescript

      - name: Property suites at depth
        working-directory: sdk-typescript
        # 100x a PR run. Measured at ~4s for 20,000, so this stays cheap even
        # at this count - the reason it is not the PR default is feedback
        # latency, not machine time.
        env:
          FC_NUM_RUNS: ${{ inputs.num_runs || '50000' }}
        run: npm test -- canonical-json-conformance

  parity:
    name: Cross-language parity (deep, random seed)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: sdk-typescript/package-lock.json
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: npm ci
        working-directory: sdk-typescript
      - run: npm run build
        working-directory: sdk-typescript
      - run: python -m pip install --quiet hypothesis==6.163.0

      - name: Generate a seed
        id: seed
        # The pinned seed in CI proves the KNOWN divergence classes stay
        # closed. A fresh seed each night is what looks for the next one, and
        # printing it means a failure is reproducible with --seed.
        run: echo "value=$RANDOM$RANDOM" >> "$GITHUB_OUTPUT"

      - name: TypeScript and Python canonicalizers must agree
        run: |
          echo "seed: ${{ steps.seed.outputs.value }}"
          node scripts/check-canonical-json-parity.mjs \
            --cases ${{ inputs.cases || '40000' }} \
            --seed ${{ steps.seed.outputs.value }}

  stress:
    name: Stress suite (serial, high concurrency)
    runs-on: ubuntu-latest
    # A healthy full run is minutes. The suite's failure mode is a stall — a
    # synchronous loop jest's per-test timer cannot preempt — and without a
    # job bound a stall occupies the runner for the 6-hour Actions default
    # while reading as "still running". Bounded, it reads as the failure it
    # is, on the morning it happens.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: sdk-typescript/package-lock.json
      - run: npm ci
        working-directory: sdk-typescript

      - name: Stress suite at full concurrency
        working-directory: sdk-typescript
        # tests/stress pushes up to 250k concurrent calls and runs serially
        # (--runInBand) because it must not share memory with parallel
        # workers - the same reason it is excluded from the PR gate: a run
        # that saturates the machine is feedback latency a PR cannot afford,
        # and contention with parallel suites would make its failures read as
        # flakes. Here it gets the machine to itself, so a failure is a
        # genuine limit being hit, not noise.
        run: npm run test:stress

  full-matrix:
    name: Full suite (Node ${{ matrix.node }} / Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["22.x", "24.x", "26.x"]
        # The ends of the supported range: the declared floor and the newest
        # interpreter `requires-python` admits.
        python: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: sdk-typescript/package-lock.json
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - run: npm ci
        working-directory: sdk-typescript
      # Part of the suite runs the SHIPPED artifact — the CLI verifier, the
      # register entry point, the auto-instrumentation loader — by importing
      # from dist/, so the tests fail to resolve their module without it. The
      # PR gate happens to build first, which is why this only ever failed
      # here.
      - run: npm run build
        working-directory: sdk-typescript
      - run: npm test
        working-directory: sdk-typescript
      - run: python -m pip install --quiet -e ".[dev]"
        working-directory: sdk-python
      - run: python -m pytest -q
        working-directory: sdk-python
