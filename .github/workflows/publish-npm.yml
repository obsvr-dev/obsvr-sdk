name: Publish @obsvr/sdk to npm

# Publishing is MANUAL ONLY. No tag or push can trigger this workflow.
# To release: Actions tab -> this workflow -> Run workflow -> type "publish"
# in the confirm box, then approve the npm-publish environment.
#
# Authentication is npm TRUSTED PUBLISHING (OIDC) — there is no token. npm
# holds a trusted-publisher record naming this repository, this filename, and
# the npm-publish environment; the OIDC claim must match all three or the
# publish is refused. Renaming this file, or changing the environment below,
# breaks publishing until the record on npmjs.com is updated to match.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "publish" to confirm you want to publish to npm'
        required: true
        type: string

# Deny by default; the publish job below re-grants exactly what it needs. This
# job holds id-token: write, which IS the publishing credential under trusted
# publishing, so a compromised step here could publish a package carrying a
# VALID provenance attestation. The narrower the default, the less any added
# step inherits.
permissions: {}

jobs:
  publish:
    name: Build and Publish
    runs-on: ubuntu-latest
    if: ${{ inputs.confirm == 'publish' }}
    # Named in the npm trusted-publisher record, so the OIDC claim carries it.
    # It also gates the job on the environment's required reviewers, which is
    # what stops a stray workflow_dispatch from reaching the publish step.
    environment: npm-publish
    # id-token: write is the publishing credential itself under trusted
    # publishing, not only the provenance signer.
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use Node.js 22.x
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.x
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: sdk-typescript/package-lock.json

      # Trusted publishing needs npm CLI >= 11.5.1; Node 22 bundles npm 10.x,
      # which has no OIDC support and sends an UNAUTHENTICATED publish. npm
      # answers that with 404 on a scoped package rather than 401, so the
      # failure reads as "package not found" and looks like a broken trusted
      # publisher record instead of a stale CLI.
      - name: Use an npm that can do trusted publishing
        run: |
          npm install -g npm@latest
          npm --version

      - name: Install dependencies
        run: npm ci
        working-directory: sdk-typescript

      - name: Build
        run: npm run build
        working-directory: sdk-typescript

      # The suite's Rego parity assertions require opa and fail without it
      # (see the same step in ci.yml). `prepublishOnly` re-runs the suite at
      # publish time as well, so the binary has to be here regardless of the
      # explicit Test step below.
      - name: Install opa (arms the Rego parity assertions)
        run: scripts/install-opa.sh

      - name: Test
        run: npm test
        working-directory: sdk-typescript
        env:
          NODE_ENV: test

      # Refuse to publish a self-contradictory version (package.json,
      # constants.ts, _version.py, the Action pin and README, and the tag).
      - name: Verify version consistency
        run: node scripts/check-version-consistency.mjs
        env:
          GITHUB_REF_TYPE: ${{ github.ref_type }}
          GITHUB_REF_NAME: ${{ github.ref_name }}

      # No --provenance flag and no NODE_AUTH_TOKEN: trusted publishing
      # authenticates over OIDC and generates the provenance attestation on
      # its own. The package has no private dependencies, so nothing earlier
      # in this job needs a registry token either.
      - name: Publish
        run: npm publish --access public
        working-directory: sdk-typescript
