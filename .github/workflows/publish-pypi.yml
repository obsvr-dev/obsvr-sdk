name: Publish obsvr-sdk to PyPI

# Publishing is MANUAL ONLY. No tag or push can trigger this workflow.
# To release: Actions tab -> this workflow -> Run workflow -> type "publish"
# in the confirm box. Requires PyPI Trusted Publishing to be configured for
# this repo + workflow in the PyPI project settings (owner-only action).
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "publish" to confirm you want to publish to PyPI'
        required: true
        type: string

# Deny by default; the publish job re-grants what it needs. Trusted Publishing
# means the id-token below IS the credential, so nothing else in this file
# should carry scopes it did not ask for.
permissions: {}

jobs:
  publish:
    name: Build and Publish
    runs-on: ubuntu-latest
    if: ${{ inputs.confirm == 'publish' }}
    # PyPI Trusted Publishing (OIDC): no long-lived token needed.
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -e ".[dev]" build==1.5.0
        working-directory: sdk-python

      - name: Test
        run: python -m pytest tests/ -q
        working-directory: sdk-python

      # Refuse to publish a self-contradictory version (package.json,
      # constants.ts, _version.py, the Action pin and README, and the tag).
      # Node is preinstalled on ubuntu-latest runners.
      - name: Verify version consistency
        run: node scripts/check-version-consistency.mjs
        env:
          GITHUB_REF_TYPE: ${{ github.ref_type }}
          GITHUB_REF_NAME: ${{ github.ref_name }}

      - name: Build sdist + wheel
        run: python -m build
        working-directory: sdk-python

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: sdk-python/dist
