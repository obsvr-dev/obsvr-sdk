name: Benchmarks

# Keeps the published performance numbers honest.
#
# BENCHMARKS.md carries per-call overhead figures, and the marketing site
# quotes them. Nothing re-measured them after they were written, so a
# regression would have shipped silently and the published claim would have
# quietly become false. That is the same class of problem as an unverified
# security claim, and it is worse here because the number is the claim.
#
# This does NOT gate a PR on timing. Shared CI runners vary enough that a
# threshold either fires constantly or is set so loose it catches nothing.
# What it does is run the suite on a schedule and keep the results as
# artifacts, so drift is visible over time and a real regression shows up as a
# trend rather than as one noisy number.

on:
  schedule:
    # Weekly. Overhead moves when the decision path changes, which is not a
    # daily event, and a weekly series is easier to read than a daily one.
    - cron: "19 5 * * 1"
  workflow_dispatch:
    inputs:
      mode:
        description: "quick smoke pass, or the full serial matrix"
        required: false
        default: "quick"
        type: choice
        options: [quick, full]

permissions:
  contents: read

jobs:
  bench:
    name: Measure governance overhead
    runs-on: ubuntu-latest
    # The full matrix runs strictly serially by design (parallel runs
    # contaminate each other's numbers, per bench/run-all.sh), so it needs
    # room well past the default step timeout.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: sdk-typescript/package-lock.json
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - run: npm ci
        working-directory: sdk-typescript
      - run: npm run build
        working-directory: sdk-typescript
      - run: python -m pip install --quiet -e .
        working-directory: sdk-python

      - name: Run the benchmark matrix
        run: |
          if [ "${{ inputs.mode || 'quick' }}" = "full" ]; then
            bench/run-all.sh
          else
            bench/run-all.sh --quick
          fi

      - name: Keep the results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bench-results-${{ github.run_number }}
          path: bench/results/
          # Long enough to compare against a quarter of history when someone
          # asks whether a number moved.
          retention-days: 90

      - name: Numbers are measured on a shared runner
        run: |
          echo "::notice::Benchmarks ran on a GitHub-hosted runner, which is noisier than"
          echo "::notice::the machine BENCHMARKS.md was measured on. Use this series to spot"
          echo "::notice::DRIFT, and re-measure on dedicated hardware before publishing a number."
