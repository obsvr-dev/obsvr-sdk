name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

# Least privilege by default. Nothing here writes to the repository: every job
# reads the tree, runs tests, and reports. A job that needs more declares it
# itself, so a step that starts wanting write access is visible in review
# rather than inheriting it. This matters most on `pull_request` from a fork,
# where the token would otherwise carry broader default scopes into a run of
# somebody else's code.
permissions:
  contents: read

jobs:
  ts-test:
    name: TypeScript SDK (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22.x, 24.x, 26.x]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: sdk-typescript/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: sdk-typescript

      - name: Build
        run: npm run build
        working-directory: sdk-typescript

      - name: Test
        run: npm test
        working-directory: sdk-typescript
        env:
          NODE_ENV: test

  py-test:
    name: Python SDK (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: pip install -e ".[dev]"
        working-directory: sdk-python

      - name: Test
        run: python -m pytest tests/ -q
        working-directory: sdk-python

      - name: Build distribution (sdist + wheel)
        run: |
          pip install build==1.5.0
          python -m build
        working-directory: sdk-python

  conformance:
    name: Cross-language conformance fixtures
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Assert both suites reference the shared fixtures
        run: |
          set -euo pipefail
          test -f conformance/fixtures/signing_vectors.json
          test -f conformance/fixtures/eval_semantics.json
          test -f conformance/fixtures/reason_codes.json
          test -f conformance/fixtures/pii_scan.json
          test -f conformance/fixtures/fail_mode.json
          test -f conformance/fixtures/policy_signature.json
          test -f conformance/fixtures/error_parity.json
          test -f conformance/fixtures/instance_guard.json
          test -f conformance/fixtures/tool_content_hash.json
          test -f conformance/fixtures/canonical_json.json
          test -f conformance/fixtures/agent_controls.json
          grep -q "conformance/fixtures/signing_vectors.json" sdk-typescript/tests/unit/signing-vectors.test.ts
          grep -q "conformance/fixtures/signing_vectors.json" sdk-typescript/tests/unit/verify-chain-conformance.test.ts
          grep -q "conformance/fixtures/signing_vectors.json" sdk-python/tests/test_verify_chain.py
          grep -q "conformance/fixtures/eval_semantics.json" sdk-typescript/tests/unit/conformance.test.ts
          grep -q "conformance/fixtures/reason_codes.json" sdk-typescript/tests/unit/reason-codes.test.ts
          grep -q "conformance/fixtures/pii_scan.json" sdk-typescript/tests/unit/pii-scan-conformance.test.ts
          grep -q "conformance/fixtures/signing_vectors.json" sdk-python/tests/test_signing.py
          grep -q "conformance/fixtures/eval_semantics.json" sdk-python/tests/test_conformance.py
          grep -q "conformance/fixtures/reason_codes.json" sdk-python/tests/test_reason_codes.py
          grep -q "conformance/fixtures/pii_scan.json" sdk-python/tests/test_pii_scan_conformance.py
          grep -q "conformance/fixtures/fail_mode.json" sdk-typescript/tests/unit/fail-mode.test.ts
          grep -q "conformance/fixtures/fail_mode.json" sdk-python/tests/test_fail_mode.py
          grep -q "conformance/fixtures/policy_signature.json" sdk-typescript/tests/unit/policy-verify.test.ts
          grep -q "conformance/fixtures/policy_signature.json" sdk-python/tests/test_policy_verify.py
          grep -q "conformance/fixtures/error_parity.json" sdk-typescript/tests/unit/policy-error.test.ts
          grep -q "conformance/fixtures/error_parity.json" sdk-python/tests/test_policy_error.py
          grep -q "conformance/fixtures/instance_guard.json" sdk-typescript/tests/unit/instance-guard.test.ts
          grep -q "conformance/fixtures/instance_guard.json" sdk-python/tests/test_instance_guard.py
          grep -q "conformance/fixtures/tool_content_hash.json" sdk-typescript/tests/unit/tool-content-hash-conformance.test.ts
          grep -q "conformance/fixtures/tool_content_hash.json" sdk-python/tests/test_tool_content_hash_conformance.py
          grep -q "conformance/fixtures/canonical_json.json" sdk-typescript/tests/unit/canonical-json-conformance.test.ts
          grep -q "conformance/fixtures/canonical_json.json" sdk-python/tests/test_canonical_json_conformance.py
          grep -q "conformance/fixtures/agent_controls.json" sdk-typescript/tests/unit/agent-controls-conformance.test.ts
          grep -q "conformance/fixtures/agent_controls.json" sdk-python/tests/test_agent_controls_conformance.py

      - name: Use Node.js 22.x
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: sdk-typescript/package-lock.json

      # Corpus drift, both pin files, and the coverage rule (every fixture has
      # an in-repo consumer). A forked copy of a "shared" fixture passes its own
      # suite forever; this is what makes it fail instead.
      - name: Conformance corpus pin (drift + pins + consumer coverage)
        run: node scripts/generate-conformance-manifest.mjs --check

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install TypeScript SDK deps
        run: npm ci
        working-directory: sdk-typescript

      - name: TypeScript fixture suites (signing vectors + chain verification + eval semantics + reason codes + pii scan + failure dispositions)
        run: npm test -- tests/unit/signing-vectors.test.ts tests/unit/verify-chain-conformance.test.ts tests/unit/conformance.test.ts tests/unit/reason-codes.test.ts tests/unit/pii-scan-conformance.test.ts tests/unit/fail-mode.test.ts tests/unit/policy-verify.test.ts tests/unit/policy-error.test.ts tests/unit/instance-guard.test.ts tests/unit/tool-content-hash-conformance.test.ts tests/unit/canonical-json-conformance.test.ts tests/unit/agent-controls-conformance.test.ts
        working-directory: sdk-typescript
        env:
          NODE_ENV: test

      - name: Install Python SDK
        run: pip install -e ".[dev]"
        working-directory: sdk-python

      - name: Python fixture suites (signing vectors + chain verification + eval semantics + reason codes + pii scan + failure dispositions)
        run: python -m pytest tests/test_signing.py tests/test_verify_chain.py tests/test_conformance.py tests/test_reason_codes.py tests/test_pii_scan_conformance.py tests/test_fail_mode.py tests/test_policy_error.py tests/test_instance_guard.py tests/test_policy_verify.py tests/test_cli_verify.py tests/test_canonical_json_conformance.py tests/test_agent_controls_conformance.py tests/test_tool_content_hash_conformance.py -q
        working-directory: sdk-python

      # Both obsvr-verify CLIs, driven over ONE export built from the shared
      # signing vectors. Each language's own suite can agree with itself
      # forever while disagreeing with the other; only this catches that.
      - name: obsvr-verify CLI parity (both languages, one export)
        run: |
          npm --prefix sdk-typescript run build
          node scripts/check-cli-verify-parity.mjs

      # The fixture above pins the divergence classes we KNOW about. This
      # generates fresh ones — fast-check on the TS side, hypothesis on the
      # Python side — and is what would find the next class. Both halves
      # canonicalize the same JSON TEXT, because some of the divergence lives
      # in the parse rather than the serializer.
      - name: Canonicalizer parity (fast-check vs hypothesis, generated corpus)
        run: node scripts/check-canonical-json-parity.mjs --cases 3000

  supply-chain:
    name: Dependency audit (npm + pip)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use Node.js 22.x
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: sdk-typescript/package-lock.json

      - name: Install TypeScript SDK deps
        run: npm ci
        working-directory: sdk-typescript

      # WHAT FAILS THE BUILD, AND WHY IT IS SPLIT IN TWO.
      #
      # The gate below is the one that protects users, so it is a hard failure
      # on anything low or above. @obsvr/sdk declares no runtime dependencies
      # and ships dist/ only, so this tree is empty today and the step passes
      # trivially — which is exactly the point. The first time a runtime
      # dependency arrives carrying an advisory, this must stop the build
      # rather than be noticed later, and a gate that only gets added once
      # there is something to catch is a gate nobody remembers to add.
      - name: npm audit (published tree — blocking)
        run: npm audit --omit=dev --audit-level=low
        working-directory: sdk-typescript

      # The dev tree is ~490 packages of jest/eslint tooling that never
      # reaches a published artifact. Failing the build on it would mean a red
      # main every time a transitive YAML parser in the test harness gets a DoS
      # advisory, and a check that is red for reasons nobody can act on this
      # week is a check people learn to click past — the dismissed-alert
      # failure, arrived at from the other direction.
      #
      # So it reports instead. It is NOT unowned: .github/dependabot.yml has
      # this ecosystem configured, so each advisory here also arrives as a pull
      # request with a diff and a reviewer. This step exists to make the same
      # information visible in the run that produced the artifact; the PR is
      # what obliges someone to act.
      - name: npm audit (dev tree — report only)
        run: npm audit || true
        working-directory: sdk-typescript

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install pip-audit
        run: pip install pip-audit==2.10.1

      # Same split, same reasoning. obsvr-sdk also declares no mandatory
      # runtime dependencies (the framework integrations and cryptography are
      # extras the caller opts into), so this audits an empty set today.
      # --strict makes a failed dependency resolution a failure too, so the
      # step cannot go green by quietly resolving nothing.
      - name: pip-audit (declared dependencies — blocking)
        run: pip-audit --strict .
        working-directory: sdk-python

      # Report-only, and for one extra reason beyond the npm case: auditing an
      # installed environment also audits the runner's own pip and setuptools,
      # whose versions this repo does not choose. Failing on those would be
      # failing on GitHub's image.
      - name: pip-audit (dev environment — report only)
        run: |
          pip install -e ".[dev]"
          pip-audit --skip-editable || true
        working-directory: sdk-python

  lint:
    name: Lint (ESLint + Ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use Node.js 22.x
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: sdk-typescript/package-lock.json

      - name: Install TypeScript SDK deps
        run: npm ci
        working-directory: sdk-typescript

      - name: ESLint (correctness rules)
        run: npm run lint
        working-directory: sdk-typescript

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Ruff (default E/F rules)
        run: |
          pip install ruff==0.16.0
          ruff check .
        working-directory: sdk-python

  version-consistency:
    name: Version consistency
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 is load-bearing for the commit-link check below, which
      # tests ancestry and has no ancestors to find in the default depth-1
      # checkout. The script refuses to run shallow rather than passing.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # catch a self-contradictory version early (package.json vs
      # constants.ts vs _version.py vs server.json). Node is preinstalled.
      - name: Check versions agree
        run: node scripts/check-version-consistency.mjs

      # A commit hash named in a tracked doc must still be reachable. History
      # rewrites retire hashes while leaving the prose around them correct, so
      # nothing else in CI would notice the link had gone dead.
      - name: Doc commit links resolve
        run: node scripts/check-doc-commit-links.mjs

  ci-complete:
    name: CI complete
    runs-on: ubuntu-latest
    needs: [ts-test, py-test, conformance, lint, version-consistency, supply-chain]
    steps:
      - run: echo "ok"
