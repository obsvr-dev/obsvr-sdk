name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

# Least privilege by default. Nothing here writes to the repository: every job
# reads the tree, runs tests, and reports. A job that needs more declares it
# itself, so a step that starts wanting write access is visible in review
# rather than inheriting it. This matters most on `pull_request` from a fork,
# where the token would otherwise carry broader default scopes into a run of
# somebody else's code.
permissions:
  contents: read

jobs:
  ts-test:
    name: TypeScript SDK (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22.x, 24.x, 26.x]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: sdk-typescript/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: sdk-typescript

      - name: Build
        run: npm run build
        working-directory: sdk-typescript

      # WHAT THIS UNBLOCKS, AND WHY IT IS A STEP RATHER THAN A COMMENT.
      #
      # tests/unit/rego-export.test.ts holds the only assertions that the Rego
      # bundle `exportToRego()` hands an operator produces the SAME verdict as
      # the SDK's own evaluator. Those assertions need `opa` on PATH. opa was
      # installed in no workflow, no script and no manifest, and the test
      # degraded without it to a green placeholder whose comment claimed the
      # parity ran "in CI where opa is present" — so the check had never
      # executed anywhere while reporting a pass on every run.
      #
      # It now FAILS when opa is absent, which is what makes this step
      # load-bearing: delete it and the suite goes red rather than quiet. The
      # binary is version-pinned and digest-verified in the script, matching
      # how every action here is SHA-pinned.
      - name: Install opa (arms the Rego parity assertions)
        run: scripts/install-opa.sh

      - name: Test
        run: npm test
        working-directory: sdk-typescript
        env:
          NODE_ENV: test

  py-test:
    name: Python SDK (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Every interpreter `requires-python` admits, so the classifier list
        # and the tested set are the same set.
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: pip install -e ".[dev]"
        working-directory: sdk-python

      - name: Test
        run: python -m pytest tests/ -q
        working-directory: sdk-python

      - name: Build distribution (sdist + wheel)
        run: |
          pip install build==1.5.0
          python -m build
        working-directory: sdk-python

  python-provider-packages:
    name: Python provider package (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: OpenAI 2.54.0
            package: openai==2.54.0
            tests: tests/test_openai_text_routes_real_package.py
          - name: Anthropic 0.125.0
            package: anthropic==0.125.0
            tests: tests/test_provider_tool_runners_real_package.py
          - name: OpenAI Agents 0.19.2
            package: openai-agents==0.19.2
            tests: tests/test_openai_agents_real_package.py
          - name: Google Gen AI 2.20.0
            package: google-genai==2.20.0
            tests: tests/test_google_genai_real_package.py
          - name: Google Generative AI 0.8.6
            package: google-generativeai==0.8.6
            tests: tests/test_google_generativeai_real_package.py
          - name: Vertex AI 1.165.1
            package: google-cloud-aiplatform==1.165.1
            tests: tests/test_vertex_real_package.py
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install SDK and official provider package
        run: pip install -e . pytest httpx "${{ matrix.package }}"
        working-directory: sdk-python

      - name: Run official-package enforcement tests
        run: python -m pytest -q ${{ matrix.tests }}
        working-directory: sdk-python

  # WHAT THIS CATCHES THAT NOTHING ELSE HERE DOES.
  #
  # Every other Python job installs the SDK editable and imports it out of the
  # checkout, so all of them run against the SOURCE TREE. A packaging defect is
  # invisible to every one of them and total for the caller: a module left out
  # of the wheel, a dropped py.typed, a dynamic version that stops resolving,
  # a console script that no longer points anywhere. The step above builds the
  # distribution but never installs it, which establishes only that the build
  # command exits zero.
  #
  # So this installs the wheel where the repository is not reachable and drives
  # a governed refusal from outside the tree, asserting the guarantee this SDK
  # exists to make: the denied tool's side effect never happens. It gates the
  # MERGE rather than running nightly, because the artifact is what ships and
  # the publish workflow builds from whatever is on main — a wheel that only
  # breaks on install would otherwise be publishable for a day before anything
  # noticed.
  #
  # The check cannot pass because the import failed: it locates the package in
  # site-packages, runs an ALLOWED tool as a positive control before asserting
  # anything about a refusal, and requires the typed policy error, the
  # TOOL_DENIED reason code and a blocked record on the wire.
  install-path-python:
    name: Install path (built wheel, Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The declared floor and the newest advertised interpreter. Packaging
        # breaks at the ends of a supported range, not in the middle.
        python-version: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Build the wheel, install it clean, drive a refusal
        run: scripts/check-install-path-python.sh

  # The same gap on the other side, and the same reasoning: every TypeScript
  # job imports out of the checkout, so an export-map entry that stops
  # resolving, a declaration file left out of `files`, or a bin pointing at a
  # module that was never compiled all reach a consumer before they reach a
  # test. This packs the tarball `npm publish` uploads, installs it into a
  # scratch package with no workspace link and no inherited node_modules, and
  # drives the same refusal from there.
  install-path-npm:
    name: Install path (packed tarball, Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The `engines` floor and the newest runtime the suites cover.
        node-version: [22.x, 26.x]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: sdk-typescript/package-lock.json

      # Here rather than inside the script so the cache above is used.
      - name: Install build dependencies
        run: npm ci
        working-directory: sdk-typescript

      - name: Pack the tarball, install it clean, drive a refusal
        run: scripts/check-install-path-npm.sh

  conformance:
    name: Cross-language conformance fixtures
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Assert both suites reference the shared fixtures
        run: |
          set -euo pipefail
          test -f conformance/fixtures/signing_vectors.json
          test -f conformance/fixtures/eval_semantics.json
          test -f conformance/fixtures/reason_codes.json
          test -f conformance/fixtures/pii_scan.json
          test -f conformance/fixtures/fail_mode.json
          test -f conformance/fixtures/policy_signature.json
          test -f conformance/fixtures/error_parity.json
          test -f conformance/fixtures/instance_guard.json
          test -f conformance/fixtures/tool_content_hash.json
          test -f conformance/fixtures/canonical_json.json
          test -f conformance/fixtures/agent_controls.json
          test -f conformance/fixtures/source_lineage.json
          grep -q "conformance/fixtures/signing_vectors.json" sdk-typescript/tests/unit/signing-vectors.test.ts
          grep -q "conformance/fixtures/signing_vectors.json" sdk-typescript/tests/unit/verify-chain-conformance.test.ts
          grep -q "conformance/fixtures/signing_vectors.json" sdk-python/tests/test_verify_chain.py
          grep -q "conformance/fixtures/eval_semantics.json" sdk-typescript/tests/unit/conformance.test.ts
          grep -q "conformance/fixtures/reason_codes.json" sdk-typescript/tests/unit/reason-codes.test.ts
          grep -q "conformance/fixtures/pii_scan.json" sdk-typescript/tests/unit/pii-scan-conformance.test.ts
          grep -q "conformance/fixtures/signing_vectors.json" sdk-python/tests/test_signing.py
          grep -q "conformance/fixtures/eval_semantics.json" sdk-python/tests/test_conformance.py
          grep -q "conformance/fixtures/reason_codes.json" sdk-python/tests/test_reason_codes.py
          grep -q "conformance/fixtures/pii_scan.json" sdk-python/tests/test_pii_scan_conformance.py
          grep -q "conformance/fixtures/fail_mode.json" sdk-typescript/tests/unit/fail-mode.test.ts
          grep -q "conformance/fixtures/fail_mode.json" sdk-python/tests/test_fail_mode.py
          grep -q "conformance/fixtures/policy_signature.json" sdk-typescript/tests/unit/policy-verify.test.ts
          grep -q "conformance/fixtures/policy_signature.json" sdk-python/tests/test_policy_verify.py
          grep -q "conformance/fixtures/error_parity.json" sdk-typescript/tests/unit/policy-error.test.ts
          grep -q "conformance/fixtures/error_parity.json" sdk-python/tests/test_policy_error.py
          grep -q "conformance/fixtures/instance_guard.json" sdk-typescript/tests/unit/instance-guard.test.ts
          grep -q "conformance/fixtures/instance_guard.json" sdk-python/tests/test_instance_guard.py
          grep -q "conformance/fixtures/tool_content_hash.json" sdk-typescript/tests/unit/tool-content-hash-conformance.test.ts
          grep -q "conformance/fixtures/tool_content_hash.json" sdk-python/tests/test_tool_content_hash_conformance.py
          grep -q "conformance/fixtures/canonical_json.json" sdk-typescript/tests/unit/canonical-json-conformance.test.ts
          grep -q "conformance/fixtures/canonical_json.json" sdk-python/tests/test_canonical_json_conformance.py
          grep -q "conformance/fixtures/agent_controls.json" sdk-typescript/tests/unit/agent-controls-conformance.test.ts
          grep -q "conformance/fixtures/agent_controls.json" sdk-python/tests/test_agent_controls_conformance.py
          grep -q "conformance/fixtures/source_lineage.json" sdk-typescript/tests/unit/source-lineage.test.ts
          grep -q "conformance/fixtures/source_lineage.json" sdk-python/tests/test_source_lineage.py

      - name: Use Node.js 22.x
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: sdk-typescript/package-lock.json

      # Corpus drift, both pin files, and the coverage rule (every fixture has
      # an in-repo consumer). A forked copy of a "shared" fixture passes its own
      # suite forever; this is what makes it fail instead.
      - name: Conformance corpus pin (drift + pins + consumer coverage)
        run: node scripts/generate-conformance-manifest.mjs --check

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install TypeScript SDK deps
        run: npm ci
        working-directory: sdk-typescript

      - name: TypeScript fixture suites (signing vectors + chain verification + eval semantics + reason codes + pii scan + failure dispositions)
        run: npm test -- tests/unit/signing-vectors.test.ts tests/unit/verify-chain-conformance.test.ts tests/unit/conformance.test.ts tests/unit/reason-codes.test.ts tests/unit/pii-scan-conformance.test.ts tests/unit/fail-mode.test.ts tests/unit/policy-verify.test.ts tests/unit/policy-error.test.ts tests/unit/instance-guard.test.ts tests/unit/tool-content-hash-conformance.test.ts tests/unit/canonical-json-conformance.test.ts tests/unit/agent-controls-conformance.test.ts
        working-directory: sdk-typescript
        env:
          NODE_ENV: test

      - name: Install Python SDK
        run: pip install -e ".[dev]"
        working-directory: sdk-python

      - name: Python fixture suites (signing vectors + chain verification + eval semantics + reason codes + pii scan + failure dispositions)
        run: python -m pytest tests/test_signing.py tests/test_verify_chain.py tests/test_conformance.py tests/test_reason_codes.py tests/test_pii_scan_conformance.py tests/test_fail_mode.py tests/test_policy_error.py tests/test_instance_guard.py tests/test_policy_verify.py tests/test_cli_verify.py tests/test_canonical_json_conformance.py tests/test_agent_controls_conformance.py tests/test_tool_content_hash_conformance.py -q
        working-directory: sdk-python

      # A `blocked` record must mean the operation did not happen. Two false
      # records reached main because nothing asserted that, and both were found
      # by hand against live providers — which is to say, found once. This is
      # the same property as a table over every gated surface, offline and
      # deterministic: no provider, no key, no network. Named as its own step
      # because it is a release gate, and a reviewer should be able to point at
      # the check rather than trust that the suite covers it.
      - name: Enforcement-reporting invariant (blocked implies not executed)
        run: python -m pytest tests/test_enforcement_reporting_invariant.py -q
        working-directory: sdk-python

      # The same property on the other side, and NOT a translation of the
      # Python grades — the two SDKs disagree about LangChain, which is exactly
      # why each language grades its own implementations.
      - name: Enforcement-reporting invariant (TypeScript half)
        run: npm test -- tests/unit/enforcement-reporting-invariant.test.ts
        working-directory: sdk-typescript
        env:
          NODE_ENV: test

      # THE REVERSE OF THE TWO STEPS ABOVE, AND THE HOLE THEY CANNOT SEE.
      #
      # "blocked implies not executed" grades refusals. A gate that stops
      # running never claims `blocked`, so every assertion in those steps holds
      # while the surface enforces nothing — which is exactly how a rule set
      # that did not arm the pre-call pipeline let a matching call execute,
      # return its result, and record `allowed`. These grade the PERMIT: an
      # `allowed` verdict has to carry the decision-input hash that evidences
      # an evaluation, and a surface that could not consult a configured layer
      # has to say `not_evaluated` instead of claiming a permit.
      #
      # Separate release-gate steps, beside their counterparts, for the same
      # reason those are: a reviewer should be able to point at the check.
      - name: Allowed-implies-evaluated invariant (Python half)
        run: python -m pytest tests/test_allowed_implies_evaluated.py -q
        working-directory: sdk-python

      - name: Allowed-implies-evaluated invariant (TypeScript half)
        run: npm test -- tests/unit/allowed-implies-evaluated.test.ts tests/unit/mcp-allowed-implies-evaluated.test.ts
        working-directory: sdk-typescript
        env:
          NODE_ENV: test

      # Both obsvr-verify CLIs, driven over ONE export built from the shared
      # signing vectors. Each language's own suite can agree with itself
      # forever while disagreeing with the other; only this catches that.
      - name: obsvr-verify CLI parity (both languages, one export)
        run: |
          npm --prefix sdk-typescript run build
          node scripts/check-cli-verify-parity.mjs

      # The fixture above pins the divergence classes we KNOW about. This
      # generates fresh ones — fast-check on the TS side, hypothesis on the
      # Python side — and is what would find the next class. Both halves
      # canonicalize the same JSON TEXT, because some of the divergence lives
      # in the parse rather than the serializer.
      - name: Canonicalizer parity (fast-check vs hypothesis, generated corpus)
        run: node scripts/check-canonical-json-parity.mjs --cases 3000

      # A customer regex rule is authored once and run by two engines, so a rule
      # that matches in one and not the other blocks a call on one SDK and
      # allows it on the other. The fixture pins the cases someone thought of;
      # this drives the CROSS PRODUCT of a pattern corpus and an input corpus
      # through both real matchers, with the input corpus built from the
      # codepoints the two engines were measured to disagree on. The TS build
      # above is what this imports.
      - name: Regex dialect parity (both engines, 3000 pattern/input pairs)
        run: node scripts/check-regex-dialect-parity.mjs

  supply-chain:
    name: Dependency audit (npm + pip)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use Node.js 22.x
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: sdk-typescript/package-lock.json

      - name: Install TypeScript SDK deps
        run: npm ci
        working-directory: sdk-typescript

      # WHAT FAILS THE BUILD, AND WHY IT IS SPLIT IN TWO.
      #
      # The gate below is the one that protects users, so it is a hard failure
      # on anything low or above. @obsvr/sdk declares no runtime dependencies
      # and ships dist/ only, so this tree is empty today and the step passes
      # trivially — which is exactly the point. The first time a runtime
      # dependency arrives carrying an advisory, this must stop the build
      # rather than be noticed later, and a gate that only gets added once
      # there is something to catch is a gate nobody remembers to add.
      - name: npm audit (published tree — blocking)
        run: npm audit --omit=dev --audit-level=low
        working-directory: sdk-typescript

      # The dev tree is ~490 packages of jest/eslint tooling that never
      # reaches a published artifact. Failing the build on it would mean a red
      # main every time a transitive YAML parser in the test harness gets a DoS
      # advisory, and a check that is red for reasons nobody can act on this
      # week is a check people learn to click past — the dismissed-alert
      # failure, arrived at from the other direction.
      #
      # So it reports instead. It is NOT unowned: .github/dependabot.yml has
      # this ecosystem configured, so each advisory here also arrives as a pull
      # request with a diff and a reviewer. This step exists to make the same
      # information visible in the run that produced the artifact; the PR is
      # what obliges someone to act.
      - name: npm audit (dev tree — report only)
        run: npm audit || true
        working-directory: sdk-typescript

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install pip-audit
        run: pip install pip-audit==2.10.1

      # Same split, same reasoning. obsvr-sdk also declares no mandatory
      # runtime dependencies (the framework integrations and cryptography are
      # extras the caller opts into), so this audits an empty set today.
      # --strict makes a failed dependency resolution a failure too, so the
      # step cannot go green by quietly resolving nothing.
      - name: pip-audit (declared dependencies — blocking)
        run: pip-audit --strict .
        working-directory: sdk-python

      # Report-only, and for one extra reason beyond the npm case: auditing an
      # installed environment also audits the runner's own pip and setuptools,
      # whose versions this repo does not choose. Failing on those would be
      # failing on GitHub's image.
      - name: pip-audit (dev environment — report only)
        run: |
          pip install -e ".[dev]"
          pip-audit --skip-editable || true
        working-directory: sdk-python

  lint:
    name: Lint (ESLint + Ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use Node.js 22.x
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: sdk-typescript/package-lock.json

      - name: Install TypeScript SDK deps
        run: npm ci
        working-directory: sdk-typescript

      - name: ESLint (correctness rules)
        run: npm run lint
        working-directory: sdk-typescript

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Ruff (default E/F rules)
        run: |
          pip install ruff==0.16.0
          ruff check .
        working-directory: sdk-python

  version-consistency:
    name: Version consistency
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 is load-bearing for the commit-link check below, which
      # tests ancestry and has no ancestors to find in the default depth-1
      # checkout. The script refuses to run shallow rather than passing.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # catch a self-contradictory version early (package.json vs
      # constants.ts vs _version.py vs server.json). Node is preinstalled.
      - name: Check versions agree
        run: node scripts/check-version-consistency.mjs

      # Both kinds of link a doc can carry. A commit hash named in a tracked doc
      # must still be reachable — history rewrites retire hashes while leaving
      # the prose around them correct — and a relative file link must resolve
      # for whoever follows it, which for the two READMEs that ship inside a
      # package means it may not be relative at all: PyPI and npm render them
      # with no repository around them, where GitHub review never can.
      - name: Doc links resolve
        run: node scripts/check-doc-commit-links.mjs

      # Every layer that consumes a principal must read the SAME resolved
      # channel. Four repairs of that one shape landed before anything
      # enforced it, and each instance is one plausible line in a file where
      # the raw metadata object is already in scope — so a reviewer catching
      # the fifth was never a reliable plan.
      - name: Principal channel is resolved once per surface
        run: node scripts/check-principal-channel.mjs

  bench-integrity:
    name: Benchmark harness integrity
    runs-on: ubuntu-latest
    # Gates on CORRECTNESS, never on timing. run-all.sh exits non-zero only for
    # chain corruption, a broken accounting invariant, or errors; the numbers
    # themselves are not asserted here, because a shared runner is too noisy for
    # a threshold that is neither constantly red nor useless. Drift in the
    # numbers stays the job of the scheduled Benchmarks workflow.
    #
    # That description was not true of the memory check until recently, and the
    # gap made this job red. --quick runs 5,000 calls, and the leak metric is
    # RSS(end) − RSS(25%), so on a runtime whose RSS is still climbing at the
    # last sample the difference measures warm-up: 30.3 MB against a 30 MB
    # threshold at 5,000 calls, 21.8 MB on the same build at 25,000. The metric
    # is still computed and printed at every size; it only FAILS the run where
    # the baseline sample can clear warm-up, which is what makes this job's
    # correctness-only description accurate rather than aspirational.
    #
    # This job exists because that scheduled workflow is weekly-and-dispatch
    # only and had never run, so nothing executed this harness at all. Its
    # verifiers had meanwhile drifted to an older signing preimage and declared
    # every governed event corrupt, which is precisely the failure a benchmark
    # nobody runs is guaranteed to develop.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: sdk-typescript/package-lock.json
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - run: npm ci
        working-directory: sdk-typescript
      - run: python -m pip install --quiet -e .
        working-directory: sdk-python

      # run-all.sh builds the TS SDK itself as part of preflight.
      - name: Smoke the benchmark matrix
        run: bench/run-all.sh --quick

  # WHAT THIS RUNS THAT NOTHING ELSE HERE DOES.
  #
  # Every other TypeScript job imports the SDK's own source and stubs the
  # boundary. This one installs the REAL provider client libraries — `openai`,
  # `together-ai`, the Bedrock client, the MCP SDK — constructs real client and
  # server objects, points them at local stubs, and lets the SDK's
  # auto-discovery find them through the package's export map. It then asserts
  # what came out: the signed schema, the HMAC chain, the policy decision, and
  # whether the governed operation actually ran.
  #
  # That difference is not academic. Every defect found in the week before this
  # job existed was invisible to 2,070 Python and 2,269 TypeScript unit tests,
  # all green throughout, and to all eighteen jobs here — and visible to these
  # suites. More unit tests of the same kind would have caught none of them.
  #
  # WHY THE SUITES ARE VENDORED RATHER THAN CHECKED OUT.
  #
  # They come from a harness that lives outside this repository and is larger:
  # it also drives live providers and real agent frameworks against real
  # credentials. Reaching that copy from a runner would need it published — it
  # has no remote — so the three options that depend on a URL (its own
  # checkout, a submodule, a package) are not available, and a job wired to a
  # repository that does not exist is a job that silently no-ops, which is
  # worse than no job.
  #
  # So the keyless half is vendored, at integration-harness/. Only the keyless
  # half: it is the only part with the three properties a merge gate needs —
  # no credentials, no network, deterministic. The cost is stated in that
  # directory's README rather than hidden: a vendored copy can drift from its
  # source, and nothing here can detect that.
  integration-harness:
    name: Integration harness (keyless suites, real client libraries)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use Node.js 22.x
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: |
            sdk-typescript/package-lock.json
            integration-harness/package-lock.json

      - name: Install TypeScript SDK deps
        run: npm ci
        working-directory: sdk-typescript

      # The suites import @obsvr/sdk through its export map, which points into
      # dist/, and the device-seal suite additionally runs the shipped
      # cli-verify.js. Both need the build, not the source.
      - name: Build the SDK the suites will import
        run: npm run build
        working-directory: sdk-typescript

      # `file:../sdk-typescript` resolves to the checkout, so these drive the
      # tree under test rather than a published package.
      - name: Install harness deps (real provider client libraries)
        run: npm ci
        working-directory: integration-harness

      # The runner exits non-zero on any failing check AND on a suite that is
      # declared but not present — a governance surface that quietly vanished
      # from the run is the failure this gate exists to prevent.
      - name: Run the keyless suites
        run: node run.mjs offline
        working-directory: integration-harness

  ci-complete:
    name: CI complete
    runs-on: ubuntu-latest
    needs:
      [
        ts-test,
        py-test,
        python-provider-packages,
        install-path-python,
        install-path-npm,
        conformance,
        integration-harness,
        lint,
        version-consistency,
        supply-chain,
        bench-integrity,
      ]
    steps:
      - run: echo "ok"
