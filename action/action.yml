name: 'Obsvr Evidence Verification'
description: >-
  Verify an exported Obsvr evidence bundle as a CI/PR check. Runs the shipped
  obsvr-verify CLI and fails the job if the audit chain does not verify.
author: 'Obsvr'
branding:
  icon: 'shield'
  color: 'green'

inputs:
  bundle:
    description: >-
      Path to the exported Obsvr evidence file to verify: an incident evidence
      bundle (trace.steps), a trace evidence bundle, or a plain JSON array of
      audit events. Relative to the repository root.
    required: true
  api-key:
    description: >-
      Obsvr signing/API key. When set, obsvr-verify recomputes every HMAC
      signature (full re-verification) so any content tamper breaks the check.
      When empty (default), only keyless structural verification runs (prev_sig
      linkage, seq_no continuity, session consistency, timestamp monotonicity).
      Always pass this via a repository/organization secret, never inline.
    required: false
    default: ''
  version:
    description: >-
      Version of @obsvr/sdk to install. The obsvr-verify CLI ships inside this
      package; pin an exact version for reproducible CI checks.
    required: false
    default: '0.16.0'
  node-version:
    description: 'Node.js version used to run obsvr-verify.'
    required: false
    default: '22'
  allow-gaps:
    description: >-
      Accept a bundle that verifies but is INCOMPLETE. The SDK signs a gap
      marker for sender-visible loss when that marker itself can be delivered,
      so those lossy runs declare their loss instead of reading clean;
      obsvr-verify reports that as exit 3,
      which fails the job by default. Set to 'true' to treat it as a pass
      (obsvr-verify --allow-gaps). Default 'false', because a bundle that is
      missing events should stop a check that exists to establish what happened
      — turn it on deliberately, for a pipeline where loss is expected and the
      declaration itself is the record you wanted.
    required: false
    default: 'false'

runs:
  using: 'composite'
  steps:
    # Pinned to a commit, not a tag. This action is PUBLISHED, so a mutable
    # ref here is inherited by every consumer's CI, not only ours, and they
    # have no way to see or override it. Dependabot updates the SHA and the
    # trailing version comment together.
    - name: Set up Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: ${{ inputs.node-version }}
        # setup-node v5 began enabling npm caching automatically whenever the
        # consumer's package.json names npm in packageManager/devEngines. This
        # action runs inside THEIR repository, so leaving the default on would
        # silently start reading and writing a cache in a workflow that never
        # asked for one. Off keeps v7 behaving exactly as the v4 pin did.
        package-manager-cache: false

    - name: Verify Obsvr evidence bundle
      shell: bash
      env:
        OBSVR_BUNDLE: ${{ inputs.bundle }}
        OBSVR_API_KEY: ${{ inputs.api-key }}
        OBSVR_SDK_VERSION: ${{ inputs.version }}
        OBSVR_ALLOW_GAPS: ${{ inputs.allow-gaps }}
      run: |
        set -euo pipefail

        if [ ! -f "${OBSVR_BUNDLE}" ]; then
          echo "::error::Evidence bundle not found: ${OBSVR_BUNDLE}"
          exit 2
        fi

        # obsvr-verify exit codes: 0 = verified, 1 = chain broken, 2 = usage
        # error, 3 = VALID BUT INCOMPLETE (a signed gap marker declares dropped
        # events). 3 fails the job like any other non-zero, and used to do so
        # with nothing here or in the README naming it — so the gap-marker
        # feature, whose whole point is that a lossy run says so, surfaced to a
        # consumer as an unexplained red check with no documented remedy. The
        # remedy existed in the CLI as --allow-gaps and was not reachable from
        # this action.
        args=("${OBSVR_BUNDLE}")
        if [ "${OBSVR_ALLOW_GAPS}" = "true" ]; then
          echo "::notice::allow-gaps is on - a bundle that verifies but declares dropped events will PASS (exit 3 treated as 0)."
          args+=("--allow-gaps")
        fi
        if [ -n "${OBSVR_API_KEY}" ]; then
          echo "Running FULL HMAC re-verification (api-key provided)."
          args+=("--api-key" "${OBSVR_API_KEY}")
        else
          echo "Running STRUCTURAL verification (no api-key)."
          echo "::notice::No api-key supplied - signatures are not recomputed. Pass a secret to api-key for full HMAC re-verification."
        fi

        # Installs the pinned SDK on demand and runs its obsvr-verify bin.
        # --ignore-scripts for the same reason the action pin above is a commit
        # and not a tag: this runs in every consumer's CI, and a lifecycle
        # script in anything the resolver pulls would execute there with their
        # job's permissions. @obsvr/sdk declares no runtime dependencies, so
        # the resolved tree is one package and nothing legitimate needs a
        # script to run. The version input is an exact pin, never a range.
        npx -y --ignore-scripts -p "@obsvr/sdk@${OBSVR_SDK_VERSION}" obsvr-verify "${args[@]}"
